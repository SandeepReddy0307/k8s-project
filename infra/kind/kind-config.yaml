# kind cluster: 1 control-plane + 2 workers so DaemonSet / affinity / topology
# spread actually demonstrate multi-node behavior on your local machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: streamflix
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
    labels:
      zone: zone-a
  - role: worker
    labels:
      zone: zone-b
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://streamflix-registry:5000"]
