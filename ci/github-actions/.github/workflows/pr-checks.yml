# Lightweight PR validation: lint Dockerfiles + helm template render check.
# Safe to run on GitHub-hosted runners (no registry/cluster access needed).
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint all charts
        run: |
          for d in gitops/charts/*/; do
            echo "Linting $d"
            helm lint "$d" || exit 1
          done
