# Alternative to ci.yml: pushes to Docker Hub instead of the local registry,
# so this can run on GitHub's free cloud-hosted runners (no self-hosted
# runner required). See docs/02-registry-choice.md for the full comparison.
#
# Setup once:
#   1. Create a free Docker Hub account + Personal Access Token.
#   2. Add repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, GITOPS_REPO_TOKEN.
name: CI (Docker Hub) - build and push microservices

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub-hosted runner — works because Docker Hub is internet-reachable
    strategy:
      matrix:
        service:
          - frontend
          - api-gateway
          - auth-service
          - catalog-service
          - user-service
          - search-service
          - recommendation-service
          - notification-service
          - billing-service
          - admin-dashboard
          - activity-tracker
          - video-encoder-job
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: <YOUR_GITHUB_USERNAME>/streamflix-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops-repo

      - name: Bump image repo+tag in GitOps repo
        run: |
          cd gitops-repo
          yq -i '.image.repository = "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}"' charts/${{ matrix.service }}/values.yaml
          yq -i '.image.tag = "${{ steps.vars.outputs.sha_short }}"' charts/${{ matrix.service }}/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add charts/${{ matrix.service }}/values.yaml
          git commit -m "ci(dockerhub): bump ${{ matrix.service }} to ${{ steps.vars.outputs.sha_short }}" || echo "no changes"
          git push
