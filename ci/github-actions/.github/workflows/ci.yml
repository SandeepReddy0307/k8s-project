# Builds every microservice as a matrix job, pushes to your local registry
# (only reachable from runners that can see localhost:5000 — i.e. this is
# meant to run on a SELF-HOSTED runner on your own machine/VM, not GitHub's
# cloud runners, since they can't reach your local Docker registry).
#
# Setup once:
#   1. In GitHub repo settings -> Actions -> Runners -> add a self-hosted runner,
#      install it on your VM (where Docker + access to localhost:5000 exists).
#   2. Push this repo to GitHub.
name: CI - build and push microservices

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        service:
          - frontend
          - api-gateway
          - auth-service
          - catalog-service
          - user-service
          - search-service
          - recommendation-service
          - notification-service
          - billing-service
          - admin-dashboard
          - video-encoder-job
          - activity-tracker
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t localhost:5000/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }} \
                       -t localhost:5000/${{ matrix.service }}:latest \
                       app/${{ matrix.service }}

      - name: Push image to local registry
        run: |
          docker push localhost:5000/${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
          docker push localhost:5000/${{ matrix.service }}:latest

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: <YOUR_GITHUB_USERNAME>/streamflix-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops-repo

      - name: Bump image tag in GitOps repo
        run: |
          cd gitops-repo
          sed -i "s|tag:.*|tag: \"${{ steps.vars.outputs.sha_short }}\"|" charts/${{ matrix.service }}/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add charts/${{ matrix.service }}/values.yaml
          git commit -m "ci: bump ${{ matrix.service }} to ${{ steps.vars.outputs.sha_short }}" || echo "no changes"
          git push
