name: Deploy reviewed StreamFlix release
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [learning, production]
        default: learning
permissions: {contents: read}
concurrency:
  group: streamflix-deploy-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  deploy:
    # This runner must have a restricted, short-lived Kubernetes identity.
    # GitHub-hosted runners cannot reach the existing local kind cluster.
    runs-on: [self-hosted, linux, streamflix]
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy immutable release
        env:
          PROFILE: ${{ inputs.profile }}
          STREAMFLIX_NAMESPACE: ${{ vars.STREAMFLIX_NAMESPACE }}
        run: bash scripts/v2/deploy.sh "$PROFILE"
