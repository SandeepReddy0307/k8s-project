apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: video-encoder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/streamflix-gitops.git
    targetRevision: main
    path: charts/video-encoder
  destination:
    server: https://kubernetes.default.svc
    namespace: streamflix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
