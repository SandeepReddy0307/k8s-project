# Separate v2 release and fresh PVCs; never mount Loki 2.6 storage without migration.
deploymentMode: Monolithic
loki:
  image: {tag: "3.7.0"}
  auth_enabled: false # Learning namespace only; expose no unauthenticated public Loki ingress.
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    storageClass: standard
    size: 10Gi
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}
minio: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
