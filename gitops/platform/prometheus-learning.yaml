grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: streamflix-ca
    hosts: [grafana.streamflix-v2.local]
    tls:
      - secretName: streamflix-grafana-tls
        hosts: [grafana.streamflix-v2.local]
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 2Gi
  sidecar:
    datasources:
      enabled: true
      resource: both
      searchNamespace: observability
  additionalDataSources:
    - name: Tempo
      uid: streamflix-tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
# Notification receivers must be configured separately with real credentials.
