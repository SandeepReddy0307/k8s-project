apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-shipper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-shipper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-shipper
subjects:
  - kind: ServiceAccount
    name: log-shipper
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-shipper
