apiVersion: v1
kind: ConfigMap
metadata:
  name: log-shipper-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info

    [INPUT]
        Name              tail
        Path              /var/log/containers/*streamflix*.log
        Tag                kube.*
        multiline.parser  docker, cri
        Mem_Buf_Limit      5MB

    [FILTER]
        Name              kubernetes
        Match             kube.*
        Kube_Tag_Prefix   kube.var.log.containers.
        Labels            Off
        Annotations       Off

    [OUTPUT]
        Name   loki
        Match  *
        Host   {{ .Values.loki.host }}
        Port   {{ .Values.loki.port }}
        URI    {{ .Values.loki.uri }}
        Labels job=fluentbit,namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name']
