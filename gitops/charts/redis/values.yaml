image:
  repository: redis
  tag: "7-alpine"
replicaCount: 1
storage:
  size: 1Gi
  storageClassName: standard
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "datastore"
    effect: "NoSchedule"
nodeAffinity:
  enabled: true
