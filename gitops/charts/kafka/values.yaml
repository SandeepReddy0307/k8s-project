image:
  repository: apache/kafka
  tag: "3.7.0"
replicaCount: 1
storage:
  size: 2Gi
  storageClassName: standard
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

# Schedules only onto the node tainted "workload=datastore:NoSchedule" (see
# scripts/07-taint-datastore-node.sh), alongside postgres/redis/elasticsearch —
# keeps all stateful I/O-heavy workloads on one dedicated node in this 2-worker
# kind cluster, demonstrating taints/tolerations + node affinity together.
tolerations:
  - key: "workload"
    operator: "Equal"
    value: "datastore"
    effect: "NoSchedule"
nodeAffinity:
  enabled: true
