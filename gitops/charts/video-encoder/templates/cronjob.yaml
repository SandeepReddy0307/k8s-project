apiVersion: batch/v1
kind: CronJob
metadata:
  name: video-encoder-nightly
spec:
  schedule: "{{ .Values.cronSchedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: video-encoder
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - { name: JOB_NAME, value: "nightly-batch" }
                - { name: TITLE_ID, value: "scheduled" }
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
