# One-off Job: trigger manually with
#   kubectl create job --from=cronjob/video-encoder-nightly manual-encode-$(date +%s) -n streamflix
apiVersion: batch/v1
kind: Job
metadata:
  name: video-encoder-sample-job
  annotations:
    "helm.sh/hook": post-install   # runs once when chart is first installed
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: video-encoder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - { name: JOB_NAME, value: "sample-install-job" }
            - { name: TITLE_ID, value: "0001" }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
