{{- if .Values.infrastructure.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: tcp, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  replicas: 1
  serviceName: postgres
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: streamflix}
    spec:
      serviceAccountName: postgres
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      tolerations: {{ toYaml .Values.infrastructure.tolerations | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.infrastructure.postgres.image | quote }}
          ports: [{containerPort: 5432}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe: {tcpSocket: {port: 5432}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: 5432}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 5432}, periodSeconds: 20}
          args:
            {{- if .Values.certificates.databaseTls }}
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            {{- end }}
            - -c
            - password_encryption=scram-sha-256
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.postgresAdmin }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.postgresAdmin }}, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
            - name: AUTH_DB_USER
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "auth-service" }}, key: username}}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "auth-service" }}, key: password}}
            - name: CATALOG_DB_USER
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "catalog-service" }}, key: username}}
            - name: CATALOG_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "catalog-service" }}, key: password}}
            - name: USER_DB_USER
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "user-service" }}, key: username}}
            - name: USER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "user-service" }}, key: password}}
            - name: BILLING_DB_USER
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "billing-service" }}, key: username}}
            - name: BILLING_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ index .Values.secrets.databases "billing-service" }}, key: password}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime, mountPath: /var/run/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            {{- if .Values.certificates.databaseTls }}
            - {name: tls, mountPath: /etc/postgres-tls, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: runtime, emptyDir: {}}
        - {name: init, configMap: {name: postgres-init, defaultMode: 0555}}
        {{- if .Values.certificates.databaseTls }}
        - {name: tls, secret: {secretName: {{ .Values.certificates.postgresSecret }}, defaultMode: 0640}}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.infrastructure.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.postgres.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: postgres}
spec:
  maxUnavailable: 0
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: tcp, port: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  replicas: 1
  serviceName: redis
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: streamflix}
    spec:
      serviceAccountName: redis
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      tolerations: {{ toYaml .Values.infrastructure.tolerations | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.infrastructure.redis.image | quote }}
          ports: [{containerPort: 6379}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe: {tcpSocket: {port: 6379}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: 6379}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 6379}, periodSeconds: 20}
          command: [sh, -c]
          args:
            - |
              case "$REDIS_PASSWORD" in *[!a-zA-Z0-9]*) echo "Learning Redis password must be alphanumeric" >&2; exit 1;; esac
              printf 'dir /data\nappendonly yes\nrequirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.redis }}, key: password}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.infrastructure.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.redis.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: redis}
spec:
  maxUnavailable: 0
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: elasticsearch}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: elasticsearch}
  ports: [{name: tcp, port: 9200}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  replicas: 1
  serviceName: elasticsearch
  selector: {matchLabels: {app.kubernetes.io/name: elasticsearch}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: streamflix}
    spec:
      serviceAccountName: elasticsearch
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      tolerations: {{ toYaml .Values.infrastructure.tolerations | nindent 8 }}
      containers:
        - name: elasticsearch
          image: {{ .Values.infrastructure.elastic.image | quote }}
          ports: [{containerPort: 9200}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          startupProbe: {tcpSocket: {port: 9200}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: 9200}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 9200}, periodSeconds: 20}
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "true"}
            - {name: xpack.security.http.ssl.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
            - name: ELASTIC_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.elastic }}, key: password}}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: tmp, mountPath: /tmp}
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.infrastructure.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.elastic.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: elasticsearch}
spec:
  maxUnavailable: 0
  selector: {matchLabels: {app.kubernetes.io/name: elasticsearch}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kafka}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  clusterIP: None
  # The KRaft controller must resolve its own Pod before broker readiness.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: kafka}
  ports: [{name: tcp, port: 9092}, {name: controller, port: 9093}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  replicas: 1
  serviceName: kafka
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: streamflix}
    spec:
      serviceAccountName: kafka
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      tolerations: {{ toYaml .Values.infrastructure.tolerations | nindent 8 }}
      containers:
        - name: kafka
          image: {{ .Values.infrastructure.kafka.image | quote }}
          ports: [{containerPort: 9092}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe: {tcpSocket: {port: 9092}, failureThreshold: 60, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: 9092}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 9092}, periodSeconds: 20}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ printf "PLAINTEXT://%s:9092" (include "streamflix.dns" (dict "name" "kafka" "root" .)) | quote }}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ printf "1@kafka-0.kafka.%s.svc.%s:9093" .Release.Namespace .Values.clusterDomain | quote }}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: tmp, mountPath: /tmp}
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.infrastructure.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.kafka.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: kafka}
spec:
  maxUnavailable: 0
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
{{- end }}
