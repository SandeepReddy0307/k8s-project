{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamflix
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.tls | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api-gateway, port: {number: {{ .Values.servicePort }}}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: {{ .Values.servicePort }}}}}
{{- end }}
