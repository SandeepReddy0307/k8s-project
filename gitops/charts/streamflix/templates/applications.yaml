{{- range $name,$service := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "service" $service }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: {{ eq $name "admin-dashboard" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: streamflix}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    - {name: http, port: {{ $.Values.servicePort }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  {{- if not (and $.Values.autoscaling.enabled (ge (int $service.replicas) 2)) }}
  replicas: {{ $service.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: streamflix}
      annotations:
        {{- if $.Values.mesh.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
      containers:
        - name: {{ $name }}
          image: {{ include "streamflix.image" $ctx | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: {{ $.Values.servicePort }}}]
          envFrom: [{configMapRef: {name: streamflix-config}}]
          env:
            {{- include "streamflix.env" $ctx | nindent 12 }}
          securityContext:
            {{- include "streamflix.security" . | nindent 12 }}
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15, timeoutSeconds: 3}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if and $service.database $.Values.certificates.databaseTls }}
            - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        {{- if and $service.database $.Values.certificates.databaseTls }}
        - name: db-ca
          configMap: {name: {{ $.Values.certificates.trustConfigMap }}}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  maxUnavailable: {{ ternary 1 0 (ge (int $service.replicas) 2) }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
{{- if and $.Values.autoscaling.enabled (ge (int $service.replicas) 2) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPU }}}}
{{- end }}
{{- if $.Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: {release: {{ $.Values.monitoring.release }}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: streamflix}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
{{- end }}
{{- end }}
