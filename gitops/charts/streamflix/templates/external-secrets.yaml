{{- if .Values.externalSecrets.enabled }}
{{- $names := dict "jwt" .Values.secrets.jwt "redis" .Values.secrets.redis "elastic" .Values.secrets.elastic "payment" .Values.secrets.payment }}
{{- range $name,$secret := $names }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $.Values.externalSecrets.storeName }}, kind: {{ $.Values.externalSecrets.storeKind }}}
  target: {name: {{ $secret }}, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ printf "%s/%s" $.Values.externalSecrets.remotePrefix $name | quote }}}
{{- end }}
{{- range $name,$secret := .Values.secrets.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $.Values.externalSecrets.storeName }}, kind: {{ $.Values.externalSecrets.storeKind }}}
  target: {name: {{ $secret }}, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ printf "%s/%s" $.Values.externalSecrets.remotePrefix $name | quote }}}
{{- end }}
{{- end }}
