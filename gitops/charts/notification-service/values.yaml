image:
  repository: docker.io/sandeep030701/notification-service
  tag: v1
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  REDIS_URL: "redis://redis:6379"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  create: true
  name: ""

# Node selection (optional, empty by default). Set in a service's own
# values.yaml to pin it to a labeled node pool — see docs/04 for the
# kind node labels (zone: zone-a / zone-b) created by infra/kind/kind-config.yaml.
nodeSelector: {}

# Tolerations (optional, empty by default). Needed only if this workload must
# schedule onto a tainted node (see the stateful charts: postgres, redis,
# elasticsearch, kafka, which tolerate the "workload=datastore:NoSchedule" taint).
tolerations: []

affinity: {}
