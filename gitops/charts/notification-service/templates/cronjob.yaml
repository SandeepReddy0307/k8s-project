apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "notification-service.fullname" . }}-digest
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["node", "src/digest.js"]
              env:
                - name: REDIS_URL
                  value: "redis://redis:6379"
