image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: "8.14.3"
replicaCount: 1
storage:
  size: 2Gi
  storageClassName: standard
resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { cpu: "1", memory: 2Gi }

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "datastore"
    effect: "NoSchedule"
nodeAffinity:
  enabled: true
