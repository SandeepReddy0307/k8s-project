apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin-dashboard.fullname" . }}
  labels:
    {{- include "admin-dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "admin-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
