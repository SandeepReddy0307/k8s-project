apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "admin-dashboard.fullname" . }}-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "admin-dashboard.fullname" . }}-pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "admin-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "admin-dashboard.fullname" . }}-pod-reader
  apiGroup: rbac.authorization.k8s.io
