image:
  repository: localhost:5000/user-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  DB_HOST: "postgres"
  DB_NAME: "userdb"
  AVATAR_DIR: "/data/avatars"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  create: true
  name: ""

persistence:
  enabled: true
  size: 1Gi
  storageClassName: standard
  mountPath: /data/avatars
