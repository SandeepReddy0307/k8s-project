# Runs automatically on first Postgres startup (official postgres image scans
# /docker-entrypoint-initdb.d/ for *.sql files, but ONLY when the data
# directory is empty — i.e. only on a brand-new volume, not on every restart).
# Creates one database per service that needs its own (see values.yaml
# "initDatabases"), since a single shared Postgres instance otherwise only
# ever has the default database from auth.database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  init-databases.sql: |
    {{- range .Values.initDatabases }}
    SELECT 'CREATE DATABASE {{ . }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
    {{- end }}
