image:
  repository: localhost:5000/frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  GATEWAY_URL: "http://api-gateway:8080"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

serviceAccount:
  create: true
  name: ""

ingress:
  enabled: true
  className: nginx
  host: streamflix.local
