# Self-signed root CA ClusterIssuer — good enough for a local lab (browsers
# will warn, but you get full cert-manager + TLS rotation workflow practice).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: streamflix-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: streamflix-local-ca
  secretName: streamflix-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: streamflix-ca-issuer
spec:
  ca:
    secretName: streamflix-ca-secret
