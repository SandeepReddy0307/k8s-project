# Issues a TLS cert for the local Ingress host, backed by streamflix-ca-issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: streamflix-tls
  namespace: streamflix
spec:
  secretName: streamflix-tls-secret
  dnsNames: ["streamflix.local"]
  issuerRef:
    name: streamflix-ca-issuer
    kind: ClusterIssuer
