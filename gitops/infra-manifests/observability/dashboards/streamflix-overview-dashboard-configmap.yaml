# Grafana sidecar (enabled in kube-prometheus-stack-values.yaml) auto-imports
# any ConfigMap labeled grafana_dashboard=1 in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamflix-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  streamflix-overview.json: |
    {
      "title": "StreamFlix Overview",
      "uid": "streamflix-overview",
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP requests/sec by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total[1m])) by (route)" }]
        },
        {
          "type": "timeseries",
          "title": "Pod CPU usage (streamflix ns)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"streamflix\"}[5m])) by (pod)" }]
        },
        {
          "type": "timeseries",
          "title": "Pod memory usage (streamflix ns)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"streamflix\"}) by (pod)" }]
        },
        {
          "type": "timeseries",
          "title": "Recommendation requests/sec (custom metric)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "sum(rate(recommendation_requests_total[1m]))" }]
        }
      ],
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" }
    }
