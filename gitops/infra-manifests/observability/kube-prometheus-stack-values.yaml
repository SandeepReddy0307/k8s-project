# Trimmed-down values for local kind usage (lower resource footprint than defaults).
grafana:
  adminPassword: "prom-operator"
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard   # ConfigMaps with this label auto-load as dashboards
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 1Gi }
    serviceMonitorSelectorNilUsesHelmValues: false   # pick up ServiceMonitors from any namespace

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

nodeExporter:
  enabled: true   # runs as a DaemonSet across all kind nodes

kubeStateMetrics:
  enabled: true
