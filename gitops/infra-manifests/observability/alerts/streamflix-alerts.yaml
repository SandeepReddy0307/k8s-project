apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: streamflix-alerts
  namespace: streamflix
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: streamflix.rules
      rules:
        - alert: ServiceDown
          expr: up{namespace="streamflix"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} is down"
            description: "Target {{ $labels.pod }} in streamflix namespace has been down for 2 minutes."

        - alert: HighPodCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="streamflix"}[5m])) by (pod) > 0.8
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "High CPU on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} has used >80% of a CPU core for 5 minutes."

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="streamflix"}[15m]) > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in {{ $labels.pod }} restarted >3 times in 15m."

        - alert: HPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"
            description: "Consider raising maxReplicas or optimizing the service."
