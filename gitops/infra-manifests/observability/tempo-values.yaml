# grafana/tempo chart for distributed tracing.
tempo:
  receivers:
    otlp:
      protocols:
        http: {endpoint: "0.0.0.0:4318"}
        grpc: {endpoint: "0.0.0.0:4317"}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 512Mi }
persistence:
  enabled: true
  size: 2Gi
