# Only the services that actually need postgres/redis/elasticsearch may reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-clients
  namespace: streamflix
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [auth-service, catalog-service, user-service]
      ports: [{ port: 5432, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-clients
  namespace: streamflix
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [notification-service, recommendation-service]
      ports: [{ port: 6379, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-es-clients
  namespace: streamflix
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: elasticsearch }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: search-service }
      ports: [{ port: 9200, protocol: TCP }]
