apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Audit   # Audit instead of Enforce since our lab uses :latest; flip to Enforce once you tag images by git SHA
  rules:
    - name: require-image-tag
      match:
        any:
          - resources: { kinds: ["Pod"] }
      validate:
        message: "Images must not use the ':latest' tag in production namespaces."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
