apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: streamflix-gateway-class
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: streamflix-gateway
  namespace: streamflix
spec:
  gatewayClassName: streamflix-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
