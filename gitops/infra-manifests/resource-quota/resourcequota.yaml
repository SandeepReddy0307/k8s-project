apiVersion: v1
kind: ResourceQuota
metadata:
  name: streamflix-quota
  namespace: streamflix
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "40"
    persistentvolumeclaims: "10"
    services.loadbalancers: "0"   # force use of Ingress/Gateway instead of LB type on local
