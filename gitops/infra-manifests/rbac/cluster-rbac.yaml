# Cluster-scoped RBAC: a read-only "sre-viewer" ClusterRole bound across all
# namespaces, useful for a monitoring/debugging ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-viewer
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io"]
    resources: ["pods", "deployments", "statefulsets", "daemonsets", "services",
                "ingresses", "jobs", "cronjobs", "horizontalpodautoscalers", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-viewer-sa
  namespace: streamflix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-viewer-binding
subjects:
  - kind: ServiceAccount
    name: sre-viewer-sa
    namespace: streamflix
roleRef:
  kind: ClusterRole
  name: sre-viewer
  apiGroup: rbac.authorization.k8s.io
