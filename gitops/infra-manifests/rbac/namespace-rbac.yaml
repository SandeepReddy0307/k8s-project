# Namespace-scoped RBAC: a "developer" role that can read/edit app resources
# but not secrets or RBAC itself (least privilege demo).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamflix-developer
  namespace: streamflix
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling"]
    resources: ["pods", "deployments", "services", "configmaps", "jobs", "cronjobs", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]   # read-only, no create/update/delete on secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamflix-developer-sa
  namespace: streamflix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: streamflix-developer-binding
  namespace: streamflix
subjects:
  - kind: ServiceAccount
    name: streamflix-developer-sa
    namespace: streamflix
roleRef:
  kind: Role
  name: streamflix-developer
  apiGroup: rbac.authorization.k8s.io
