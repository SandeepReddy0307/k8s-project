# Helm values for prometheus-community/prometheus-adapter, enabling HPA to
# scale recommendation-service on a custom metric (requests/sec) instead of
# just CPU. Install with:
#   helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#     -n observability -f gitops/infra-manifests/hpa-vpa/prometheus-adapter-values.yaml
prometheus:
  url: http://kube-prometheus-stack-prometheus.observability.svc
  port: 9090
rules:
  default: false
  custom:
    - seriesQuery: 'recommendation_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: { resource: "namespace" }
          pod: { resource: "pod" }
      name:
        matches: "^(.*)_total"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
