apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: streamflix
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: streamflix
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-service-pdb
  namespace: streamflix
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
